<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed - Car Fix Garage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FF6B1F' width='100' height='100' rx='20'/%3E%3Ctext x='50' y='70' text-anchor='middle' fill='white' font-size='50' font-family='Arial' font-weight='bold'%3ECF%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header>
    <div class="container header-content">
      <a href="/" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
        </div>
        <span>Car Fix</span>
      </a>
    </div>
  </header>

  <div class="success-page">
    <div class="success-card">
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </div>

      <h1 id="successTitle">Booking Confirmed!</h1>
      <p id="successMessage">Thank you for your booking. We have sent a confirmation to your email.</p>

      <div class="booking-details" id="bookingDetails">
        <div class="booking-detail-item">
          <label id="labelBookingId">Booking ID</label>
          <span id="bookingId">-</span>
        </div>
        <div class="booking-detail-item">
          <label id="labelDate">Appointment Date</label>
          <span id="appointmentDate">-</span>
        </div>
        <div class="booking-detail-item">
          <label id="labelTime">Appointment Time</label>
          <span id="appointmentTime">-</span>
        </div>
        <div class="booking-detail-item">
          <label id="labelTotal">Total Paid</label>
          <span id="totalPaid">-</span>
        </div>
      </div>

      <a href="/" class="btn btn-primary" id="backBtn">Back to Home</a>
    </div>
  </div>

  <script>
    // Get booking details from URL
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');

    // Load saved language
    const lang = localStorage.getItem('lang') || 'en';

    // Translations
    const translations = {
      en: {
        title: 'Booking Confirmed!',
        message: 'Thank you for your booking. We have sent a confirmation to your email.',
        bookingId: 'Booking ID',
        date: 'Appointment Date',
        time: 'Appointment Time',
        total: 'Total Paid',
        back: 'Back to Home',
        morning: 'Morning (8:00 - 12:00)',
        afternoon: 'Afternoon (12:00 - 17:00)',
        evening: 'Evening (17:00 - 19:00)'
      },
      lv: {
        title: 'Rezervācija apstiprināta!',
        message: 'Paldies par rezervāciju. Apstiprinājums nosūtīts uz jūsu e-pastu.',
        bookingId: 'Rezervācijas ID',
        date: 'Vizītes datums',
        time: 'Vizītes laiks',
        total: 'Kopējā summa',
        back: 'Atpakaļ uz sākumu',
        morning: 'Rīts (8:00 - 12:00)',
        afternoon: 'Pēcpusdiena (12:00 - 17:00)',
        evening: 'Vakars (17:00 - 19:00)'
      },
      ru: {
        title: 'Запись подтверждена!',
        message: 'Спасибо за запись. Подтверждение отправлено на вашу почту.',
        bookingId: 'Номер записи',
        date: 'Дата визита',
        time: 'Время визита',
        total: 'Оплачено',
        back: 'На главную',
        morning: 'Утро (8:00 - 12:00)',
        afternoon: 'День (12:00 - 17:00)',
        evening: 'Вечер (17:00 - 19:00)'
      }
    };

    const t = translations[lang] || translations.en;

    // Apply translations
    document.getElementById('successTitle').textContent = t.title;
    document.getElementById('successMessage').textContent = t.message;
    document.getElementById('labelBookingId').textContent = t.bookingId;
    document.getElementById('labelDate').textContent = t.date;
    document.getElementById('labelTime').textContent = t.time;
    document.getElementById('labelTotal').textContent = t.total;
    document.getElementById('backBtn').textContent = t.back;

    // Fetch booking details
    if (sessionId) {
      fetch(`/api/bookings/${sessionId}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('bookingId').textContent = data.id?.slice(0, 8) || '-';
          document.getElementById('appointmentDate').textContent = data.appointmentDate || '-';

          const timeMap = {
            morning: t.morning,
            afternoon: t.afternoon,
            evening: t.evening
          };
          document.getElementById('appointmentTime').textContent = timeMap[data.appointmentTime] || data.appointmentTime || '-';
          document.getElementById('totalPaid').textContent = data.totalPrice ? `€${data.totalPrice}` : '-';
        })
        .catch(err => {
          console.error('Error fetching booking:', err);
        });
    }
  </script>
</body>
</html>
